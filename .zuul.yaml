---
- project:
    vars:
      ensure_tox_version: '<4'
    check:
      jobs:
        - openstack-tox-linters
        - k8sapp-kubevirt-tox-py39
        - k8sapp-kubevirt-tox-flake8
        - k8sapp-kubevirt-tox-pylint
        - k8sapp-kubevirt-tox-metadata
        - k8sapp-kubevirt-tox-coverage
        - k8sapp-kubevirt-tox-bandit
        - k8sapp-kubevirt-tox-bandit-trixie
        - k8sapp-kubevirt-tox-py313
        - k8sapp-kubevirt-tox-flake8-trixie
        - k8sapp-kubevirt-tox-pylint-trixie
        - k8sapp-kubevirt-tox-metadata-trixie
        - k8sapp-kubevirt-tox-coverage-trixie
    gate:
      jobs:
        - openstack-tox-linters
        - k8sapp-kubevirt-tox-py39
        - k8sapp-kubevirt-tox-flake8
        - k8sapp-kubevirt-tox-pylint
        - k8sapp-kubevirt-tox-metadata
        - k8sapp-kubevirt-tox-coverage
        - k8sapp-kubevirt-tox-bandit
        - k8sapp-kubevirt-tox-bandit-trixie
        - k8sapp-kubevirt-tox-py313
        - k8sapp-kubevirt-tox-flake8-trixie
        - k8sapp-kubevirt-tox-pylint-trixie
        - k8sapp-kubevirt-tox-metadata-trixie
        - k8sapp-kubevirt-tox-coverage-trixie

    post:
      jobs:
        - stx-app-kubevirt-upload-git-mirror

- job:
    name: k8sapp-kubevirt-tox-py39
    parent: tox-py39
    description: |
      Run py39 for kubevirt app
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/root
      - starlingx/utilities
    files:
      - python3-k8sapp-kubevirt/*
    vars:
      tox_envlist: py39
      tox_extra_args: -c python3-k8sapp-kubevirt/k8sapp_kubevirt/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-kubevirt-tox-flake8
    parent: tox
    description: |
        Run flake8 for kubevirt
    nodeset: debian-bullseye
    files:
      - python3-k8sapp-kubevirt/*
    vars:
        tox_envlist: flake8
        tox_extra_args: -c python3-k8sapp-kubevirt/k8sapp_kubevirt/tox.ini

- job:
    name: k8sapp-kubevirt-tox-metadata
    parent: tox
    description: |
      Run metadata test for k8sapp_kubevirt
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/root
      - starlingx/utilities
    nodeset: debian-bullseye
    vars:
      tox_envlist: metadata
      tox_extra_args: -c python3-k8sapp-kubevirt/k8sapp_kubevirt/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-kubevirt-tox-pylint
    parent: tox
    description: |
      Run pylint test for k8sapp_kubevirt
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/root
      - starlingx/utilities
    nodeset: debian-bullseye
    files:
      - python3-k8sapp-kubevirt/*
    vars:
      tox_envlist: pylint
      tox_extra_args: -c python3-k8sapp-kubevirt/k8sapp_kubevirt/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-kubevirt-tox-bandit
    parent: tox
    description: |
        Run bandit for kubevirt
    nodeset: debian-bullseye
    files:
      - python3-k8sapp-kubevirt/*
    vars:
        tox_envlist: bandit
        tox_extra_args: -c python3-k8sapp-kubevirt/k8sapp_kubevirt/tox.ini

- job:
    name: k8sapp-kubevirt-tox-bandit-trixie
    parent: tox
    description: |
      Run bandit for kubevirt (trixie)
    nodeset: debian-trixie-8GB
    required-projects:
      - starlingx/root
    files:
      - python3-k8sapp-kubevirt/*
    vars:
      tox_envlist: bandit-trixie
      tox_extra_args: -c python3-k8sapp-kubevirt/k8sapp_kubevirt/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/trixie/upper-constraints.txt'

- job:
    name: stx-app-kubevirt-upload-git-mirror
    parent: upload-git-mirror
    description: >
      Mirrors opendev.org/starlingx/app-kubevirt to
      github.com/starlingx/app-kubevirt
    vars:
      git_mirror_repository: starlingx/app-kubevirt
    secrets:
      - name: git_mirror_credentials
        secret: stx-app-kubevirt-github-secret
        pass-to-parent: true

