apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: cdi
spec:
  certConfig:
    ca:
      duration: {{ .Values.certificateRotate.ca.duration }}
      renewBefore: {{ .Values.certificateRotate.ca.renewBefore }}
    client:
      duration: {{ .Values.certificateRotate.client.duration }}
      renewBefore: {{ .Values.certificateRotate.client.renewBefore }}
    server:
      duration: {{ .Values.certificateRotate.server.duration }}
      renewBefore: {{ .Values.certificateRotate.server.renewBefore }}
  config:
    featureGates: {{ toJson (.Values.featureGates | default (list)) }}
    imagePullSecrets:
    - name: {{ .Values.imagePullSecrets }}
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
      node-role.kubernetes.io/control-plane: ""
    tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
  workload:
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
    - effect: NoSchedule
      key: CriticalAddonsOnly
      operator: Exists
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
