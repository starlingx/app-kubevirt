cdi:
  certificateRotate:
    ca:
      duration: 1440h
      renewBefore: 720h
    server:
      duration: 1440h
      renewBefore: 720h
    client:
      duration: 1440h
      renewBefore: 720h
  componentType: platform
  containerPorts:
    metricsPort: 8080
  featureGates:
    - HonorWaitForFirstConsumer
  imagePullSecrets: default-registry-key
  images:
    tags:
      cdiApiServerImage: quay.io/kubevirt/cdi-apiserver:v1.64.0
      cdiClonerImage: quay.io/kubevirt/cdi-cloner:v1.64.0
      cdiControllerImage: quay.io/kubevirt/cdi-controller:v1.64.0
      cdiImporterImage: quay.io/kubevirt/cdi-importer:v1.64.0
      cdiOperatorImage: quay.io/kubevirt/cdi-operator:v1.64.0
      cdiUploadProxyImage: quay.io/kubevirt/cdi-uploadproxy:v1.64.0
      cdiUploadServerImage: quay.io/kubevirt/cdi-uploadserver:v1.64.0
  replicas: 1
  resources:
    requests:
      memory: 150Mi
kubevirt:
  certificateRotate:
    ca:
      duration: 1440h
      renewBefore: 720h
    server:
      duration: 1440h
      renewBefore: 720h
  componentType: platform
  containerPorts:
    metricsPort: 8443
    webhooksPort: 8444
  featureGates:
    - Snapshot
  imagePullSecrets: default-registry-key
  images:
    tags:
      virtApiImage: quay.io/kubevirt/virt-api:v1.7.0
      virtControllerImage: quay.io/kubevirt/virt-controller:v1.7.0
      virtCtlImage: docker.io/starlingx/stx-kubevirt-app:stx.12.0-v1.7.0
      virtHandlerImage: quay.io/kubevirt/virt-handler:v1.7.0
      virtLauncherImage: quay.io/kubevirt/virt-launcher:v1.7.0
      virtOperatorImage: quay.io/kubevirt/virt-operator:v1.7.0
  readinessProbePort: 8443
  replicas: 1
  resources:
    requests:
      memory: 400Mi
  version: v1.7.0
